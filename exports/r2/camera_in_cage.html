<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nikon ZR — Camera in Cage</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1a1a1a; font-family: system-ui, sans-serif; overflow:hidden; }
  #canvas { display:block; width:100vw; height:100vh; }
  #ui {
    position:fixed; top:16px; left:16px;
    background:rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.12);
    border-radius:10px; padding:14px 18px; color:#ddd; font-size:13px;
    backdrop-filter:blur(8px);
  }
  #ui h3 { font-size:14px; color:#fff; margin-bottom:10px; letter-spacing:.5px; }
  #ui label { display:flex; align-items:center; gap:8px; margin-bottom:6px; cursor:pointer; }
  #ui input[type=range] { width:120px; accent-color:#4af; }
  .tag { font-size:11px; color:#888; margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,.08); }
  #loading {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:#1a1a1a; color:#aaa; font-size:16px; flex-direction:column; gap:12px;
  }
  .spinner {
    width:36px; height:36px; border:3px solid rgba(255,255,255,.1);
    border-top-color:#4af; border-radius:50%; animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><span id="loadmsg">Loading cage assembly…</span></div>
<canvas id="canvas"></canvas>
<div id="ui">
  <h3>🎥 ZR in Cage — R2</h3>
  <label><input type="checkbox" id="chkCage" checked> Cage assembly</label>
  <label><input type="checkbox" id="chkCam"  checked> Nikon ZR body</label>
  <label>
    Camera opacity
    <input type="range" id="sldOpacity" min="0" max="100" value="85">
  </label>
  <div class="tag">Drag to orbit · Scroll to zoom · Right-drag to pan</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';
import { STLLoader }     from 'three/addons/loaders/STLLoader.js';

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias:true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);
scene.fog = new THREE.Fog(0x1a1a1a, 600, 1200);

const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.5, 3000);
camera.position.set(220, -260, 160);
camera.up.set(0, 0, 1);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 40);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.update();

// Lights
const amb = new THREE.AmbientLight(0xffffff, 0.45);
scene.add(amb);

const key = new THREE.DirectionalLight(0xfff4e0, 2.2);
key.position.set(150, -200, 300);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.near = 10;
key.shadow.camera.far = 800;
key.shadow.camera.left = -200; key.shadow.camera.right = 200;
key.shadow.camera.top = 200;   key.shadow.camera.bottom = -200;
scene.add(key);

const fill = new THREE.DirectionalLight(0xc8d8ff, 0.7);
fill.position.set(-200, 100, 100);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xffffff, 0.4);
rim.position.set(0, 300, -100);
scene.add(rim);

// Ground plane
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(800, 800),
  new THREE.MeshStandardMaterial({ color:0x111111, roughness:0.9, metalness:0.0 })
);
ground.position.z = -12;
ground.receiveShadow = true;
scene.add(ground);

let cageGroup = new THREE.Group();
let camMesh = null;
scene.add(cageGroup);

// ── Load cage GLB ─────────────────────────────────────────────────────────────
const gltfLoader = new GLTFLoader();
gltfLoader.load('zr_modular_complete.glb',
  (gltf) => {
    gltf.scene.traverse(o => {
      if (o.isMesh) {
        o.castShadow = true;
        o.receiveShadow = true;
      }
    });
    cageGroup.add(gltf.scene);
    document.getElementById('loadmsg').textContent = 'Loading camera model…';
    loadCamera();
  },
  (xhr) => {
    if (xhr.total) document.getElementById('loadmsg').textContent =
      `Loading cage… ${Math.round(xhr.loaded/xhr.total*100)}%`;
  }
);

// ── Load camera STL ───────────────────────────────────────────────────────────
function loadCamera() {
  const stlLoader = new STLLoader();
  stlLoader.load('camera_aligned.stl',
    (geo) => {
      geo.computeVertexNormals();
      const mat = new THREE.MeshStandardMaterial({
        color: 0xc8cdd2,
        roughness: 0.35,
        metalness: 0.15,
        transparent: true,
        opacity: 0.85,
      });
      camMesh = new THREE.Mesh(geo, mat);
      camMesh.castShadow = true;
      camMesh.receiveShadow = true;
      scene.add(camMesh);

      document.getElementById('loading').style.display = 'none';
      document.getElementById('loadmsg').textContent = '';
    },
    (xhr) => {
      if (xhr.total) document.getElementById('loadmsg').textContent =
        `Loading camera… ${Math.round(xhr.loaded/xhr.total*100)}%`;
    }
  );
}

// ── UI controls ───────────────────────────────────────────────────────────────
document.getElementById('chkCage').addEventListener('change', e => {
  cageGroup.visible = e.target.checked;
});
document.getElementById('chkCam').addEventListener('change', e => {
  if (camMesh) camMesh.visible = e.target.checked;
});
document.getElementById('sldOpacity').addEventListener('input', e => {
  if (camMesh) {
    camMesh.material.opacity = e.target.value / 100;
    camMesh.material.transparent = camMesh.material.opacity < 1.0;
  }
});

// ── Render loop ───────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
